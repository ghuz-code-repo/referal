<script>
// AJAX form submission for add referal
$(document).ready(function() {
    $('#add-referal-form').on('submit', function(e) {
        e.preventDefault();
        
        if (!validateAddReferalForm(this)) {
            return false;
        }
        
        const formData = new FormData(this);
        const submitBtn = $(this).find('button[type="submit"]');
        const originalText = submitBtn.html();
        
        // Disable button and show loading
        submitBtn.prop('disabled', true);
        submitBtn.html('<i class="fas fa-spinner fa-spin"></i> Сохранение...');
        
        $.ajax({
            url: $(this).attr('action'),
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(response) {
                if (response.success) {
                    // Show success message
                    showFlashMessage('success', response.message || 'Реферал успешно добавлен!');
                    
                    // Close modal
                    closeModal(document.getElementById('DocumentFormModal_new'));
                    
                    // Reset form
                    $('#add-referal-form')[0].reset();
                    
                    // Reload page to show new referral
                    setTimeout(function() {
                        window.location.reload();
                    }, 1500);
                } else {
                    // Show error message
                    showFlashMessage('error', response.message || 'Ошибка при добавлении реферала');
                }
            },
            error: function(xhr, status, error) {
                console.error('Error:', error);
                showFlashMessage('error', 'Ошибка при отправке данных. Попробуйте еще раз.');
            },
            complete: function() {
                // Re-enable button
                submitBtn.prop('disabled', false);
                submitBtn.html(originalText);
            }
        });
        
        return false;
    });
});
