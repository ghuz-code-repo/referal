<!-- Модальное окно для ручного добавления договора к рефералу -->
<div id="addDealModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">
            <h3><i class="fas fa-plus-circle"></i> Добавить договор к рефералу</h3>
            <button class="close-btn" onclick="closeAddDealModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="addDealReferalName">Реферал:</label>
                <input type="text" 
                       id="addDealReferalName" 
                       class="form-control" 
                       readonly 
                       style="background-color: #f0f0f0;">
                <input type="hidden" id="addDealReferalId">
            </div>
            
            <div class="form-group">
                <label for="addDealAgreementNumber">Номер договора: *</label>
                <input type="text" 
                       id="addDealAgreementNumber" 
                       class="form-control" 
                       placeholder="Введите номер договора..."
                       required>
                <small class="form-text text-muted">
                    Введите номер договора, который существует в системе
                </small>
            </div>
            
            <div id="addDealError" class="alert alert-danger" style="display: none; margin-top: 15px;">
                <i class="fas fa-exclamation-circle"></i>
                <span id="addDealErrorMessage"></span>
            </div>
            
            <div id="addDealSuccess" class="alert alert-success" style="display: none; margin-top: 15px;">
                <i class="fas fa-check-circle"></i>
                <span id="addDealSuccessMessage"></span>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeAddDealModal()">
                <i class="fas fa-times"></i> Отмена
            </button>
            <button type="button" class="btn btn-primary" onclick="submitAddDeal()">
                <i class="fas fa-plus"></i> Добавить
            </button>
        </div>
    </div>
</div>

<style>
    #addDealModal .modal-content {
        animation: slideDown 0.3s ease-out;
    }
    
    @keyframes slideDown {
        from {
            transform: translateY(-50px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
    
    #addDealModal .form-group {
        margin-bottom: 20px;
    }
    
    #addDealModal .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #333;
    }
    
    #addDealModal .form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
    }
    
    #addDealModal .form-control:focus {
        outline: none;
        border-color: #4CAF50;
        box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.1);
    }
    
    #addDealModal .form-text {
        display: block;
        margin-top: 5px;
        font-size: 12px;
        color: #666;
    }
    
    #addDealModal .alert {
        padding: 12px 15px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    #addDealModal .alert-danger {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
    }
    
    #addDealModal .alert-success {
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
    }
</style>

<script>
    function openAddDealModal(referalId, referalName) {
        console.log('Opening add deal modal for referal:', referalId, referalName);
        
        // Заполняем данные реферала
        document.getElementById('addDealReferalId').value = referalId;
        document.getElementById('addDealReferalName').value = referalName || 'Неизвестно';
        
        // Очищаем поля
        document.getElementById('addDealAgreementNumber').value = '';
        document.getElementById('addDealError').style.display = 'none';
        document.getElementById('addDealSuccess').style.display = 'none';
        
        // Показываем модальное окно
        document.getElementById('addDealModal').style.display = 'flex';
    }
    
    function closeAddDealModal() {
        document.getElementById('addDealModal').style.display = 'none';
    }
    
    function submitAddDeal() {
        const referalId = document.getElementById('addDealReferalId').value;
        const agreementNumber = document.getElementById('addDealAgreementNumber').value.trim();
        
        // Валидация
        if (!agreementNumber) {
            showAddDealError('Пожалуйста, введите номер договора');
            return;
        }
        
        // Скрываем предыдущие сообщения
        document.getElementById('addDealError').style.display = 'none';
        document.getElementById('addDealSuccess').style.display = 'none';
        
        // Отправляем запрос
        fetch(`/referal/admin/referal/${referalId}/add_deal`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                agreement_number: agreementNumber
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showAddDealSuccess(data.message);
                
                // Через 2 секунды перезагружаем страницу
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            } else {
                showAddDealError(data.message);
            }
        })
        .catch(error => {
            console.error('Error adding deal:', error);
            showAddDealError('Произошла ошибка при добавлении договора');
        });
    }
    
    function showAddDealError(message) {
        const errorDiv = document.getElementById('addDealError');
        const errorMsg = document.getElementById('addDealErrorMessage');
        errorMsg.textContent = message;
        errorDiv.style.display = 'flex';
    }
    
    function showAddDealSuccess(message) {
        const successDiv = document.getElementById('addDealSuccess');
        const successMsg = document.getElementById('addDealSuccessMessage');
        successMsg.textContent = message;
        successDiv.style.display = 'flex';
    }
    
    // Закрытие модального окна при клике вне его
    document.getElementById('addDealModal')?.addEventListener('click', function(e) {
        if (e.target === this) {
            closeAddDealModal();
        }
    });
    
    // Закрытие по Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('addDealModal').style.display === 'flex') {
            closeAddDealModal();
        }
    });
    
    // Enter в поле ввода = отправка формы
    document.getElementById('addDealAgreementNumber')?.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            submitAddDeal();
        }
    });
</script>
