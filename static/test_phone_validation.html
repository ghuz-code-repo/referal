<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест валидации телефонов</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-form { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        input[type="text"] { width: 200px; padding: 5px; margin: 5px; }
        button { padding: 10px 15px; margin: 5px; }
        .result { margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🧪 Тест валидации телефонов</h1>

    <div class="test-form">
        <h3>Одиночный номер (как в форме реферала)</h3>
        <form id="singlePhoneForm">
            <label>Номер телефона:</label><br>
            <input type="text" name="phone_number" placeholder="+998 XX XXX XX XX"><br>
            <button type="submit">Проверить</button>
        </form>
        <div id="singleResult" class="result"></div>
    </div>

    <div class="test-form">
        <h3>Множественные номера (админ функции)</h3>
        <form id="multiplePhoneForm">
            <label>Номера телефонов (через запятую):</label><br>
            <input type="text" name="phone" class="multiple-phones-supported" placeholder="+998 XX XXX XX XX, +998 YY YYY YY YY"><br>
            <button type="submit">Проверить</button>
        </form>
        <div id="multipleResult" class="result"></div>
    </div>

    <script>
/**
 * Функция форматирования телефона для одиночного номера
 */
function formatSinglePhone(input) {
    let value = input.value;
    
    // Убираем все кроме цифр и +
    let cleanValue = value.replace(/[^\d+]/g, '');
    
    // Если номер не начинается с +998, добавляем префикс
    if (!cleanValue.startsWith('+998')) {
        if (cleanValue.startsWith('998')) {
            cleanValue = '+' + cleanValue;
        } else if (cleanValue.startsWith('+')) {
            cleanValue = '+998' + cleanValue.substring(1);
        } else {
            cleanValue = '+998' + cleanValue;
        }
    }
    
    // Получаем только цифры после +998
    let digits = cleanValue.substring(4).replace(/\D/g, '');
    
    // Ограничиваем до 9 цифр
    if (digits.length > 9) {
        digits = digits.substring(0, 9);
    }
    
    // Форматируем номер с пробелами: +998 XX XXX XX XX
    let formatted = '+998';
    if (digits.length > 0) {
        formatted += ' ' + digits.substring(0, Math.min(2, digits.length));
    }
    if (digits.length > 2) {
        formatted += ' ' + digits.substring(2, Math.min(5, digits.length));
    }
    if (digits.length > 5) {
        formatted += ' ' + digits.substring(5, Math.min(7, digits.length));
    }
    if (digits.length > 7) {
        formatted += ' ' + digits.substring(7, 9);
    }
    
    input.value = formatted;
}

/**
 * Функция форматирования телефона с поддержкой множественных номеров (для админа)
 */
function formatMultiplePhones(input) {
    let value = input.value;
    
    // Split by comma to handle multiple phones
    let phones = value.split(',');
    let formattedPhones = [];
    
    for (let i = 0; i < phones.length; i++) {
        let phone = phones[i].trim();
        
        // Skip empty entries
        if (!phone) continue;
        
        // Всегда поддерживаем префикс для каждого номера
        if (!phone.startsWith('+998 ')) {
            phone = '+998 ' + phone.replace(/^\+998\s*/g, '');
        }
        
        // Получаем только цифры после префикса
        let digits = phone.substring(5).replace(/\D/g, '');
        
        // Ограничиваем до 9 цифр
        if (digits.length > 9) {
            digits = digits.substring(0, 9);
        }
        
        // Форматируем номер с пробелами: XX XXX XX XX
        let formatted = '';
        if (digits.length > 0) {
            formatted += digits.substring(0, Math.min(2, digits.length));
        }
        if (digits.length > 2) {
            formatted += ' ' + digits.substring(2, Math.min(5, digits.length));
        }
        if (digits.length > 5) {
            formatted += ' ' + digits.substring(5, Math.min(7, digits.length));
        }
        if (digits.length > 7) {
            formatted += ' ' + digits.substring(7, 9);
        }
        
        // Добавляем отформатированный номер
        if (formatted.trim()) {
            formattedPhones.push('+998 ' + formatted);
        }
    }
    
    // Обновляем значение поля ввода
    input.value = formattedPhones.join(', ');
}

/**
 * Инициализация валидации телефонов
 */
function initPhoneValidation() {
    // Находим все поля телефонов
    const phoneInputs = document.querySelectorAll('input[name="phone"], input[name="phone_number"]');
    
    phoneInputs.forEach(function(input) {
        // Определяем, поддерживает ли поле множественные номера
        const isMultipleSupported = input.classList.contains('multiple-phones-supported') || 
                                   input.closest('.admin-panel') || 
                                   input.closest('[data-allow-multiple]');
        
        // Устанавливаем значение по умолчанию
        if (!input.value) {
            input.value = '+998 ';
        }
        
        input.addEventListener('input', function() {
            if (isMultipleSupported) {
                formatMultiplePhones(this);
            } else {
                formatSinglePhone(this);
            }
        });
        
        input.addEventListener('focus', function() {
            if (this.value.length <= 5) {
                this.value = '+998 ';
                setTimeout(() => {
                    this.selectionStart = this.selectionEnd = 5;
                }, 0);
            }
        });
        
        // Проверка перед отправкой формы
        if (input.form) {
            input.form.addEventListener('submit', function(e) {
                if (isMultipleSupported) {
                    // Проверка для множественных номеров
                    const phones = input.value.split(',');
                    let allValid = true;
                    
                    for (let phone of phones) {
                        phone = phone.trim();
                        if (!phone) continue;
                        
                        const digits = phone.substring(5).replace(/\D/g, '');
                        if (digits.length !== 9) {
                            allValid = false;
                            break;
                        }
                    }
                    
                    if (!allValid) {
                        alert('Пожалуйста, введите 9 цифр для каждого номера телефона после кода страны. Для множественных номеров разделяйте их запятыми.');
                        e.preventDefault();
                    }
                } else {
                    // Проверка для одиночного номера
                    const phone = input.value.trim();
                    if (phone && phone !== '+998 ') {
                        const digits = phone.substring(5).replace(/\D/g, '');
                        if (digits.length !== 9) {
                            alert('Пожалуйста, введите корректный номер телефона в формате +998 XX XXX XX XX');
                            e.preventDefault();
                        }
                    }
                }
            });
        }
    });
}

// Алиас для обратной совместимости
function formatPhone(input) {
    formatSinglePhone(input);
}

// Запускаем инициализацию при загрузке DOM
document.addEventListener('DOMContentLoaded', function() {
    initPhoneValidation();
    
    // Тестовые обработчики форм
    document.getElementById('singlePhoneForm').addEventListener('submit', function(e) {
        const input = this.querySelector('input[name="phone_number"]');
        const result = document.getElementById('singleResult');
        if (!e.defaultPrevented) {
            e.preventDefault();
            result.innerHTML = `✅ Валидация прошла! Номер: "${input.value}"`;
            result.style.color = 'green';
        } else {
            result.innerHTML = `❌ Валидация не прошла!`;
            result.style.color = 'red';
        }
    });
    
    document.getElementById('multiplePhoneForm').addEventListener('submit', function(e) {
        const input = this.querySelector('input[name="phone"]');
        const result = document.getElementById('multipleResult');
        if (!e.defaultPrevented) {
            e.preventDefault();
            result.innerHTML = `✅ Валидация прошла! Номера: "${input.value}"`;
            result.style.color = 'green';
        } else {
            result.innerHTML = `❌ Валидация не прошла!`;
            result.style.color = 'red';
        }
    });
});
    </script>
</body>
</html>
