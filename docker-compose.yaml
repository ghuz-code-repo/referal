services:
  postgres:
    image: postgres:16-alpine
    container_name: referal_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-referal_db}
      POSTGRES_USER: ${POSTGRES_USER:-referal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-referal_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - service_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-referal_user} -d ${POSTGRES_DB:-referal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  referal:
    image: referal
    container_name: referal
    build:
      context: ..  # Use parent directory to access shared auth-connector
      dockerfile: referal/Dockerfile
      additional_contexts:
        auth-connector: ../auth-connector
    labels:
      - "nginx.auth=true"
    volumes:
      - ./instance:/app/instance
      - ./templates:/app/templates
      - ./static:/app/static
      - ./documents:/app/documents
      - ./backups:/app/backups
    env_file:
      - .env
    environment:
      - CONTAINER_NAME=referal  # For service discovery registration
    networks:
      - service_network     # Только внутренняя сеть сервисов
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:80/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
    name: referal_postgres_data

networks:
  service_network:
    external: true
    name: service_network