services:
  postgres:
    image: postgres:16-alpine
    container_name: referal_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-referal_db}
      POSTGRES_USER: ${POSTGRES_USER:-referal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-referal_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - service_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-referal_user} -d ${POSTGRES_DB:-referal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  referal:
    image: referal
    container_name: referal
    build:
      context: ..  # Use parent directory to access shared auth-connector
      dockerfile: referal/Dockerfile
      additional_contexts:
        auth-connector: ../auth-connector
    labels:
      - "nginx.auth=true"
    volumes:
      - ./instance:/app/instance
      - ./templates:/app/templates
      - ./static:/app/static
      - ./documents:/app/documents
      - ./backups:/app/backups
    env_file:
      - .env
    environment:
      - CONTAINER_NAME=referal  # For service discovery registration
    networks:
      - service_network     # Внутренняя сеть сервисов (internal, без выхода наружу)
      - egress_network      # Доступ к внешним ресурсам: MySQL MacroCRM (172.16.0.199)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:80/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: referal_postgres_backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-referal_db}
      POSTGRES_USER: ${POSTGRES_USER:-referal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-referal_password}
      POSTGRES_EXTRA_OPTS: "-Z6 --blobs"
      # Cron schedule (default: every day at 03:00 server time)
      SCHEDULE: ${BACKUP_SCHEDULE:-0 0 3 * * *}
      # Retention policy:
      #   daily/   - last 7 daily dumps (this week, Mon..Sun)
      #   weekly/  - one Sunday dump per week, last 53 weeks (~1 year)
      #   monthly/ - one dump from the 1st of each month, last 12 months
      # On Mondays the previous Sunday's file leaves daily/ but stays in weekly/.
      # Max files at any moment: 7 + 53 + 12 = 72.
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-53}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
      HEALTHCHECK_PORT: 8080
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - ./backups:/backups
    networks:
      - service_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: referal_postgres_data

networks:
  service_network:
    external: true
    name: service_network
  egress_network:
    external: true
    name: egress_network