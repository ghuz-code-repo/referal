[tool:pytest]
# Конфигурация pytest для referal сервиса

# Папки с тестами
testpaths = tests

# Паттерны файлов с тестами
python_files = test_*.py *_test.py

# Паттерны классов с тестами
python_classes = Test*

# Паттерны функций с тестами
python_functions = test_*

# Минимальная версия pytest
minversion = 6.0

# Дополнительные опции
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70

# Маркеры для тестов
markers =
    unit: Модульные тесты
    integration: Интеграционные тесты
    auth: Тесты аутентификации
    api: Тесты API
    slow: Медленные тесты
    database: Тесты базы данных
    mock: Тесты с mock объектами

# Исключения из покрытия
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    node_modules

# Фильтры предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*SQLAlchemy.*:DeprecationWarning